name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version (规则自测 / tag 与 VERSION 一致 / 段位 ≤10 / alpha 递增)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要全部 tag 才能校验 alpha 序号单调递增

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 反例自测：1.11.0 / alpha0 / alpha01 / tag 与版本不一致 必须被拦住
      - name: 版本规则反例自测
        working-directory: app
        run: node scripts/check-version.mjs --self-test

      # VERSION 与 5 处清单一致；tag 推送时 tag 去 v 后必须等于 VERSION
      - name: 校验 VERSION / 清单 / tag 一致
        working-directory: app
        run: node scripts/check-version.mjs

      - name: 校验开发构建注入无漂移
        working-directory: app
        run: node scripts/version.mjs --check

  frontend:
    name: frontend (npm ci / tsc / vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        run: npm ci

      - name: 类型检查（tsc --noEmit）
        run: npx tsc --noEmit

      - name: 拖放状态机自测（21 条）
        run: npm run test:drop

      - name: 输入历史逻辑自测（26 条）
        run: npm run test:history

      - name: 正则方言自测（\1 分组引用，18 条）
        run: npm run test:regex

      - name: 大小写例外词表自测（18 条）
        run: npm run test:case

      # 元数据字段守卫：前端字段表 / 五语种文案 / 规则求值 / Rust 结构体必须一一对应
      - name: 元数据取名字段自测（17 字段，50 条）
        run: npm run test:meta

      # 孤儿样式守卫：CSS 里出现但源码已不再引用的 .class 一律视为死代码，必须先删再合并
      - name: 孤儿样式选择器检查
        run: npm run test:css

      # 设计稿必须与实现共用同一套 --ds-* 令牌；令牌值变了但 design/ 未重新确认则失败
      - name: 设计稿令牌反例自测
        run: npm run tokens:selftest

      - name: 设计稿令牌同步校验（引用 / 裸值 / 快照）
        run: npm run tokens:check

      - name: 生产构建（vite build）
        run: npx vite build

  backend:
    name: backend (fmt / clippy / cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tauri-build 的 generate_context! 在编译期需要 frontendDist（app/dist）存在，
      # 否则 cargo test 会在 build script 阶段就失败。这里只为满足编译期资源检查，
      # 不做类型检查（类型检查由 frontend job 负责）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 准备编译期前端资源
        working-directory: app
        run: npm ci && npx vite build

      - name: 安装 Tauri v2 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            app/src-tauri/renomio-core -> target

      # 仅暴露格式差异，不阻断构建（与 clippy 同策略）；
      # 本地开发请运行 cargo fmt 修正。
      - name: cargo fmt --check（非阻断，仅暴露格式差异）
        run: |
          cargo fmt --manifest-path app/src-tauri/Cargo.toml --check || true
          cargo fmt --manifest-path app/src-tauri/renomio-core/Cargo.toml --check || true

      # 只暴露 clippy 警告，不加 -D warnings，因此警告不会阻断构建；
      # 真正的编译错误仍会让该步失败。
      - name: cargo clippy（仅暴露警告，不阻断）
        run: |
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets
          cargo clippy --manifest-path app/src-tauri/renomio-core/Cargo.toml --all-targets

      - name: cargo test（renomio-core 核心）
        run: cargo test --manifest-path app/src-tauri/renomio-core/Cargo.toml

      - name: cargo test（Tauri 壳，含 migrate.rs 迁移单测）
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

  bundle-checks:
    name: bundle-checks (windows / 14 条产物断言 + 13 条离线断言)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 断言分两组：
      #   离线组（13 条）：只读 tauri.conf.json / tauri.linux.conf.json / tauri.macos.conf.json /
      #     installer-hooks.nsh，CI 每次真实执行；
      #   产物组（14 条）：读已构建的 MSI、NSIS、WiX/NSIS 生成脚本，需 `npm run tauri build` 之后才有。
      #   MSI（bundle/msi/*.msi）、NSIS 安装包（bundle/nsis/*-setup.exe）、
      #   WiX 生成脚本（target/release/wix/x64/main.wxs）、
      #   NSIS 生成脚本（target/release/nsis/x64/installer.nsi）。
      # 这些文件只有 `npm run tauri build` 之后才存在，CI 不构建 Windows 安装包（原因见 README / 下方 summary），
      # 所以本步只做「产物是否就位」判定：就位才跑断言，否则显式跳过并写明原因，不伪造通过。
      - name: 离线断言（13 条，不依赖构建产物）
        shell: pwsh
        run: ./app/scripts/check-bundle.ps1 -Offline

      - name: 判定产物是否就位
        id: artifacts
        shell: pwsh
        run: |
          $release = 'app/src-tauri/target/release'
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          $need = @(
            "$release/bundle/msi/Renomio_${version}_x64_en-US.msi",
            "$release/bundle/nsis/Renomio_${version}_x64-setup.exe",
            "$release/wix/x64/main.wxs",
            "$release/nsis/x64/installer.nsi"
          )
          $missing = @($need | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -eq 0) {
            'present=true' >> $env:GITHUB_OUTPUT
            Write-Host '全部产物就位，将执行 14 条断言'
          } else {
            'present=false' >> $env:GITHUB_OUTPUT
            Write-Host '缺少以下产物，将跳过断言：'
            $missing | ForEach-Object { Write-Host "  - $_" }
          }

      - name: 跳过说明（产物未构建）
        if: steps.artifacts.outputs.present == 'false'
        shell: pwsh
        run: |
          @'
          ## 产物组：已跳过（0/14 条产物断言执行；离线组 13 条已在上一步真实执行）

          原因：产物组的 **14 条断言全部依赖已构建产物**（离线组 13 条已在「离线断言」步骤真实执行并通过）。

          | # | 断言 | 依赖 |
          | --- | --- | --- |
          | 1 | MSI 产物存在 | `target/release/bundle/msi/*.msi`（需 tauri build） |
          | 2 | NSIS 产物存在 | `target/release/bundle/nsis/*-setup.exe`（需 tauri build） |
          | 3 | WiX 生成脚本存在 | `target/release/wix/x64/main.wxs`（需 tauri build） |
          | 4 | NSIS 生成脚本存在 | `target/release/nsis/x64/installer.nsi`（需 tauri build） |
          | 5 | MSI `ALLUSERS=1` | 读取已构建 MSI 的 Property 表（WindowsInstaller COM） |
          | 6 | MSI `ProductName=Renomio` | 同上 |
          | 7 | WiX `InstallScope="perMachine"` | 读取生成的 main.wxs |
          | 8 | WiX 安装根 `PlatformProgramFilesFolder` | 读取生成的 main.wxs |
          | 9 | WiX `INSTALLDIR` 名为 Renomio | 读取生成的 main.wxs |
          | 10 | WiX `UpgradeCode` 已换新 | 读取生成的 main.wxs |
          | 11 | x64 分支解析为 `ProgramFiles64Folder` | 读取生成的 main.wxs |
          | 12 | NSIS `INSTALLMODE "both"` | 读取生成的 installer.nsi |
          | 13 | NSIS `MULTIUSER_PAGE_INSTALLMODE` | 读取生成的 installer.nsi |
          | 14 | NSIS `MULTIUSER_USE_PROGRAMFILES64` | 读取生成的 installer.nsi |

          CI 未纳入 Windows 产物断言（原因：GitHub 托管的 windows runner 上跑完整 Tauri release 构建 + NSIS/WiX 工具下载
          约需 8–12 分钟；发布前在本地以 `npm run test:bundle` 逐条执行）。
          三平台出包见 `bundle-linux` / `bundle-macos` / `bundle-windows` job（产物含 updater `.sig`，上传为 artifact，不进 Release）。

          因此本 job 在此次运行中 **只验证了产物缺失这一事实**，没有任何断言被判为 PASS。
          '@ >> $env:GITHUB_STEP_SUMMARY
          Write-Host '::warning title=bundle-checks skipped::14 条断言依赖构建产物，CI 未构建 Windows 安装包，已跳过并在 step summary 说明原因'

      - name: 执行 check-bundle.ps1（14 条断言）
        if: steps.artifacts.outputs.present == 'true'
        shell: pwsh
        run: |
          ./app/scripts/check-bundle.ps1

  # 以下三个 job 产出安装包并上传为可下载 artifact，同时生成 updater 签名（.sig）：
  #   - 签名私钥由仓库 secret `TAURI_SIGNING_PRIVATE_KEY` 注入（本机 renomio.key，空口令），
  #     与 tauri.conf.json 的 `plugins.updater.pubkey` 配对；私钥不落仓库、不打印；
  #   - 仍不更新 GitHub Release、不改 updates/latest.json（发布是单独步骤）；
  #   - 主配置已开 `createUpdaterArtifacts`，构建命令不再用 --config 关掉它。
  bundle-linux:
    name: bundle-linux (deb / AppImage + .sig)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装 Tauri v2 Linux 依赖（同 backend）+ 冒烟测试工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            patchelf \
            xvfb openbox xdotool imagemagick \
            fontconfig fonts-noto-cjk
          # Ubuntu 24.04 起 libfuse2 拆成 libfuse2t64；AppImage 打包工具需要 FUSE
          sudo apt-get install -y --no-install-recommends libfuse2t64 \
            || sudo apt-get install -y --no-install-recommends libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            app/src-tauri/renomio-core -> target

      - name: npm ci
        run: npm ci

      - name: 构建 deb + AppImage（含 updater 签名）
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1' # runner 无 FUSE 时让 appimagetool 自解压运行
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: '' # 密钥为空口令，显式给空值避免交互式提示
        run: npm run tauri build

      - name: 校验冒烟环境具备中文字体（缺字体会让截图出现豆腐块）
        run: |
          set -euo pipefail
          echo "系统字体数：$(fc-list | wc -l)"
          if ! fc-list :lang=zh-cn | grep -q .; then
            echo '::error title=缺少中文字体::fc-list :lang=zh-cn 为空，冒烟截图中的中文会渲染成方块'
            exit 1
          fi
          fc-list :lang=zh-cn family | sort -u | head -n 10

      - name: 冒烟：Xvfb + openbox 启动 AppImage（验证 WebKitGTK 可加载、窗口可创建）
        run: |
          set -euo pipefail
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"

          Xvfb :99 -screen 0 1440x900x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          export APPIMAGE_EXTRACT_AND_RUN=1
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export LIBGL_ALWAYS_SOFTWARE=1
          sleep 2
          openbox >/tmp/openbox.log 2>&1 &
          sleep 1

          "$APPIMAGE" >/tmp/appimage-run.log 2>&1 &
          APP_PID=$!
          FOUND=0
          for _ in $(seq 1 30); do
            sleep 2
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo '::error title=AppImage 启动失败::进程在 60 秒内退出'
              tail -n 80 /tmp/appimage-run.log
              exit 1
            fi
            if xdotool search --name 'Renomio' >/dev/null 2>&1; then FOUND=1; break; fi
          done
          if [ "$FOUND" = "1" ]; then
            WID="$(xdotool search --name 'Renomio' | tail -n1)"
            echo "窗口已创建（id=$WID），几何："
            xdotool getwindowgeometry --shell "$WID" || true
            xdotool windowactivate "$WID" 2>/dev/null || true
            sleep 5
            # 优先抓窗口本身：root 截图在 Xvfb 下可能只有空白根窗口
            import -window "$WID" linux-smoke-window.png 2>/dev/null || true
          else
            echo '::warning title=未发现 Renomio 窗口::进程存活但 60 秒内未匹配到窗口标题，见截图与日志'
          fi
          import -window root linux-smoke.png 2>/dev/null || true
          cp /tmp/appimage-run.log appimage-run.log || true
          kill "$APP_PID" 2>/dev/null || true

      - name: 产物清单与 SHA-256
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/appimage \
              -maxdepth 1 -type f | sort
          )
          {
            echo '## Linux 产物（含 updater 签名，未进 Release）'
            echo ''
            echo '```'
            ls -l "${files[@]}"
            echo ''
            sha256sum "${files[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: renomio-linux-x64
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/deb/*.sig
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renomio-linux-smoke
          path: |
            app/linux-smoke.png
            app/linux-smoke-window.png
            app/appimage-run.log
          if-no-files-found: warn

  bundle-macos:
    name: bundle-macos (app / dmg + .sig，ad-hoc 未公证)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            app/src-tauri/renomio-core -> target

      - name: npm ci
        run: npm ci

      - name: 构建 app + dmg（含 updater 签名）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: '' # 密钥为空口令，显式给空值避免交互式提示
        run: npm run tauri build -- --bundles app,dmg

      - name: ad-hoc 签名并重打 dmg（无 Apple 证书，不做公证）
        run: bash ./scripts/sign/build-macos.sh --no-build

      # 重打 dmg 会让 tauri build 生成的 dmg.sig 失效，必须对最终 dmg 重新签名
      - name: 为最终 dmg 重新生成 updater 签名
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: '' # 密钥为空口令，显式给空值避免交互式提示
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          rm -f "$DMG.sig"
          npx tauri signer sign --app-version "$(cat ../VERSION)" "$DMG"
          test -s "$DMG.sig"

      - name: 打包 .app 为 zip（保留符号链接与可执行权限）
        run: |
          set -euo pipefail
          VER="$(cat ../VERSION)"
          ARCH="$(uname -m)"
          ditto -c -k --keepParent \
            src-tauri/target/release/bundle/macos/Renomio.app \
            "src-tauri/target/release/bundle/macos/Renomio_${VER}_${ARCH}.app.zip"

      - name: 校验签名与 Gatekeeper 判定（如实记录）
        run: |
          set -euo pipefail
          APP=src-tauri/target/release/bundle/macos/Renomio.app
          echo '== codesign --verify（必须通过：ad-hoc 也应自洽）=='
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo '== 签名信息 =='
          codesign -dvv "$APP" 2>&1 | head -n 12 || true
          echo '== spctl（预期 rejected：无 Apple 身份）=='
          spctl -a -vvv -t exec "$APP" 2>&1 || true
          echo '== dmg 校验 =='
          hdiutil verify src-tauri/target/release/bundle/dmg/*.dmg

      - name: 产物清单与 SHA-256
        run: |
          set -euo pipefail
          {
            echo '## macOS 产物（ad-hoc 未公证，含 updater 签名，未进 Release）'
            echo ''
            echo '```'
            ls -l src-tauri/target/release/bundle/dmg/* \
                  src-tauri/target/release/bundle/macos/*.app.zip \
                  src-tauri/target/release/bundle/macos/*.app.tar.gz*
            echo ''
            shasum -a 256 src-tauri/target/release/bundle/dmg/* \
                          src-tauri/target/release/bundle/macos/*.app.zip \
                          src-tauri/target/release/bundle/macos/*.app.tar.gz*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: renomio-macos-arm64
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/dmg/*.sig
            app/src-tauri/target/release/bundle/macos/*.app.zip
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # Windows 安装包：此前只在本地构建，现在由 CI 与 Linux/macOS 同源产出，并生成 updater 签名。
  bundle-windows:
    name: bundle-windows (msi / nsis + .sig)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            app/src-tauri/renomio-core -> target

      - name: npm ci
        run: npm ci

      - name: 构建 MSI + NSIS（含 updater 签名）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: '' # 密钥为空口令，显式给空值避免交互式提示
        run: npm run tauri build -- --bundles msi,nsis

      - name: 产物清单与 SHA-256
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem 'src-tauri/target/release/bundle/msi/*' -File
            Get-ChildItem 'src-tauri/target/release/bundle/nsis/*' -File
          )
          $installers = @($files | Where-Object { $_.Extension -in '.msi', '.exe' })
          if ($installers.Count -eq 0) { throw '未找到 msi / setup.exe 产物' }
          $lines = @('## Windows 产物（含 updater 签名，未进 Release）', '', '```')
          foreach ($f in $files) {
            $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += ('{0}  {1}  {2}' -f $h, $f.Length, $f.Name)
          }
          $lines += '```'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
