<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<title>Renomio · P0 界面原型（可交互 v3）</title>
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f4f5f7;
    --surface-3:#e9ebef;
    --surface-hover:#f0f2f5;
    --text:#1b1d21;
    --text-2:#5c626b;
    --text-muted:#949ba4;
    --line:#e2e4e9;
    --line-2:#cfd3da;
    --accent:#0a6cff;
    --accent-weak:#e6efff;
    --accent-text:#0a4fb5;
    --on-accent:#ffffff;
    --cb-bg:#ffffff;
    --ok:#13803c;
    --warn:#9b6400;
    --danger:#c33a2f;
    --row-h:32px;
    --cols:32px minmax(200px,1fr) 84px 132px minmax(190px,232px) 100px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"Cascadia Mono",Consolas,"Liberation Mono",monospace;
    --shadow-pop:0 10px 28px rgba(16,20,28,.16),0 1px 3px rgba(16,20,28,.10);
  }
  [data-theme="dark"]{
    --bg:#1c1d20;
    --surface:#232427;
    --surface-2:#282a2d;
    --surface-3:#323438;
    --surface-hover:#2e3034;
    --text:#e8e9ec;
    --text-2:#a8adb5;
    --text-muted:#7d838c;
    --line:#34363b;
    --line-2:#3f4247;
    --accent:#3f8cff;
    --accent-weak:#1e2b3d;
    --accent-text:#a8c6ff;
    --cb-bg:#313338;
    --ok:#4bbf7a;
    --warn:#d5a44a;
    --danger:#e5736a;
    --shadow-pop:0 12px 32px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);font-size:12px;color:var(--text);background:var(--bg);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit;color:inherit}

  /* ---------- 通用控件：全部居中，无内联快捷键 ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
       height:28px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;
       background:var(--surface);font-size:12px;line-height:1;font-weight:500;cursor:default;
       white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s;
       -webkit-user-select:none;user-select:none}
  .btn>svg{display:block;flex:0 0 auto}
  .btn>span{display:block;line-height:1}
  .btn:hover{background:var(--surface-hover)}
  .btn:active{background:var(--surface-3)}
  .btn:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 34%,transparent);outline-offset:1px}
  .btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.primary:active{filter:brightness(.94)}
  .btn.soft{background:var(--accent-weak);border-color:transparent;color:var(--accent-text);font-weight:600}
  .btn.soft:hover{filter:brightness(.97)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
  .btn.ghost:hover{background:var(--surface-hover);color:var(--text)}
  .btn.icon{width:28px;padding:0;color:var(--text-2)}
  .btn.icon:hover{color:var(--text)}
  .btn.sm{height:24px;padding:0 8px;font-size:11.5px;border-radius:6px}
  .btn[disabled]{opacity:.5;cursor:default;background:var(--surface);border-color:var(--line)}
  .btn[disabled]:hover{background:var(--surface)}
  .btn.primary[disabled]{background:var(--surface-3);border-color:transparent;color:var(--text-muted);opacity:.7}
  .btn.primary[disabled]:hover{background:var(--surface-3)}

  svg.ic{width:14px;height:14px;flex:0 0 auto;display:block;stroke:currentColor;stroke-width:1.5;
         fill:none;stroke-linecap:round;stroke-linejoin:round}
  svg.ic.sm{width:12px;height:12px;stroke-width:1.4}
  svg.ic.xs{width:10px;height:10px;stroke-width:1.6}

  .win{position:relative;width:1440px;height:900px;display:flex;flex-direction:column;
       min-height:0;overflow:hidden;background:var(--bg)}

  /* ---------- 标题栏 ---------- */
  .titlebar{height:38px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 0 0 12px;
            background:var(--surface);border-bottom:1px solid var(--line)}
  .brand{width:15px;height:15px;border-radius:4px;background:linear-gradient(140deg,#5b86ff,#1452d8);flex:0 0 auto}
  .product{font-size:13px;font-weight:600;letter-spacing:.1px;line-height:1}
  .tb-flex{flex:1}
  .caption{display:flex;height:38px}
  .caption button{width:44px;height:38px;border:0;background:transparent;display:grid;place-items:center;
                  color:#8b9199;cursor:default}
  .caption button:hover{background:var(--surface-hover);color:var(--text)}
  .caption button.close:hover{background:#e81123;color:#fff}
  .caption button:active{filter:brightness(.94)}

  /* ---------- 工具栏 ---------- */
  .toolbar{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 12px;
           background:var(--surface);border-bottom:1px solid var(--line)}
  .grp{display:flex;align-items:center;gap:6px}
  .tb-flex2{flex:1}
  .search{position:relative;display:flex;align-items:center;gap:6px;width:236px;height:28px;
          padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);
          color:var(--text-muted);transition:border-color .12s,background .12s,box-shadow .12s}
  .search:focus-within{border-color:var(--accent);background:var(--surface);
                       box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;
                font-size:12px;color:var(--text);line-height:1}
  .search input::placeholder{color:var(--text-muted)}
  .search .clear{display:none;width:16px;height:16px;border:0;border-radius:50%;padding:0;
                 background:var(--surface-3);color:var(--text-2);place-items:center}
  .search .clear.on{display:grid}

  /* ---------- 路径条 ---------- */
  .pathbar{height:38px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;
           background:var(--surface-2);border-bottom:1px solid var(--line);overflow:hidden}
  .pathbtn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:0;
           border-radius:6px;background:transparent;color:var(--text-2);font-size:11.5px;line-height:1;
           max-width:236px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
  .pathbtn:hover{background:var(--surface-3);color:var(--text)}
  .pathbtn .p{font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis}
  .flt{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;
       background:var(--surface-3);color:var(--text-2);font-size:11px;line-height:1;white-space:nowrap}
  .flt b{font-family:var(--mono);font-size:11px;color:var(--text);font-weight:600}
  .pb-flex{flex:1}
  .pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:6px;
        border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:11.5px;
        line-height:1;white-space:nowrap;cursor:default}
  .pill:hover{background:var(--surface-hover)}
  .pill .dim{color:var(--text-2)}

  /* ---------- 主体 ---------- */
  .body{flex:1;display:flex;min-height:0}

  .nav{width:220px;flex:0 0 auto;background:var(--surface-2);border-right:1px solid var(--line);
       padding:10px 0 8px;display:flex;flex-direction:column;overflow:hidden}
  .nav-label{padding:0 14px 4px;color:var(--text-muted);font-size:10.5px;letter-spacing:.4px}
  .nav-item{display:flex;align-items:center;gap:8px;height:30px;margin:1px 8px;padding:0 8px;
            border:0;border-radius:7px;background:transparent;font-size:12px;line-height:1;
            text-align:left;cursor:default;width:calc(100% - 16px)}
  .nav-item>svg{color:var(--text-2)}
  .nav-item:hover{background:var(--surface-3)}
  .nav-item.active{background:var(--accent-weak);color:var(--accent-text);font-weight:600}
  .nav-item.active>svg{color:var(--accent)}
  .nav-item .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-muted)}
  .nav-item.active .cnt{color:var(--accent-text)}
  .nav-flex{flex:1}

  .pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .pane-head{height:50px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 16px;
             border-bottom:1px solid var(--line)}
  .pane-head h1{margin:0;font-size:16px;font-weight:600;line-height:1;letter-spacing:.1px}
  .ph-count{font-family:var(--mono);font-size:11px;color:var(--text-muted);line-height:1}
  .ph-flex{flex:1}

  /* ---------- 表格：表头与行共用同一套网格 ---------- */
  .table{flex:1;min-height:0;display:flex;flex-direction:column}
  .thead{flex:0 0 auto;display:grid;grid-template-columns:var(--cols);height:30px;
         align-items:center;border-bottom:1px solid var(--line);background:var(--surface-2);
         color:var(--text-2);font-size:11px}
  .rows{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
  .rows::-webkit-scrollbar{width:10px}
  .rows::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;border:3px solid var(--bg)}
  .trow{display:grid;grid-template-columns:var(--cols);align-items:center;height:var(--row-h);
        border-bottom:1px solid var(--line);font-size:12px;cursor:default;
        transition:background .1s}
  .trow:hover{background:var(--surface-hover)}
  .trow.sel{background:var(--accent-weak)}
  .trow.sel:hover{filter:brightness(.97)}
  .trow.focus{box-shadow:inset 3px 0 0 var(--accent)}
  .trow.stripe:nth-child(even){background:var(--surface-2)}
  .trow.stripe.sel:nth-child(even){background:var(--accent-weak)}

  .cell{padding:0 8px;min-width:0;display:flex;align-items:center;height:100%;line-height:1}
  .cell.num{justify-content:flex-end}
  .cell.cbx{padding-left:12px;padding-right:0}
  .cell.name{gap:6px}
  .cb{width:14px;height:14px;flex:0 0 auto;border:1px solid var(--line-2);border-radius:3.5px;
      background:var(--cb-bg);display:grid;place-items:center;cursor:default;padding:0}
  .cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .cb:hover{border-color:var(--accent)}
  .cb svg{width:9px;height:9px;stroke-width:2.6;display:block}
  .cb.mixed{background:var(--accent);border-color:var(--accent);color:#fff}
  .thumb{width:16px;height:16px;flex:0 0 auto;border-radius:3px;background:var(--surface-3);
         display:grid;place-items:center;color:var(--text-muted)}
  .fn{font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;line-height:1}
  .lock{color:var(--text-muted);flex:0 0 auto}
  .dim2{color:var(--text-2);font-family:var(--mono);font-size:11px;white-space:nowrap}
  .newname{font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis;line-height:1}
  .newdiff{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);
           border-radius:3px;padding:1px 3px;margin:-1px -3px}
  .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1}
  .st.ok{color:var(--ok)}
  .st.warn{color:var(--warn)}
  .st.none{color:var(--text-muted)}
  .st::before{content:"";width:5px;height:5px;border-radius:50%;flex:0 0 auto}
  .st.ok::before{background:var(--ok)}
  .st.warn::before{background:var(--warn)}
  .st.none::before{background:var(--line-2)}

  .empty{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-2)}
  .empty.on{display:flex}
  .empty-ic{width:44px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;
            place-items:center;color:var(--text-muted)}
  .empty-ic svg{width:22px;height:22px;stroke-width:1.6}
  .empty p{margin:0;font-size:13px;color:var(--text-2);line-height:1}
  .empty .sub{font-size:11.5px;color:var(--text-muted)}
  .empty-acts{display:flex;gap:8px}

  /* ---------- 底部抽屉 ---------- */
  .drawer{flex:0 0 auto;height:190px;border-top:1px solid var(--line);background:var(--surface);
          display:flex;flex-direction:column;transition:height .18s ease}
  .drawer.collapsed{height:36px}
  .dw-head{height:36px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;
           background:var(--surface-2);border-bottom:1px solid var(--line)}
  .drawer.collapsed .dw-head{border-bottom:0;background:transparent}
  .dw-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.3px;
          color:var(--text-muted);line-height:1;flex:0 0 auto}
  .dw-subj{font-family:var(--mono);font-size:11.5px;line-height:1;max-width:200px;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
  .dw-subj.empty{color:var(--text-muted);font-family:var(--font);font-size:11.5px}
  .dw-flex{flex:1}
  .seg{display:inline-flex;height:26px;padding:2px;gap:2px;border-radius:7px;background:var(--surface-3);
       flex:0 0 auto}
  .drawer.collapsed .seg{display:none}
  .seg button{height:22px;padding:0 9px;border:0;border-radius:5px;background:transparent;
              color:var(--text-2);font-size:11px;line-height:1;cursor:default;white-space:nowrap}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--surface);color:var(--text);font-weight:600;
                 box-shadow:0 1px 2px rgba(0,0,0,.07)}
  .dw-sum{display:none;font-size:10.5px;color:var(--text-muted);line-height:1}
  .drawer.collapsed .dw-sum{display:inline}
  .dw-body{flex:1;min-height:0;overflow:hidden;padding:8px 14px 10px;
           display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 26px;align-content:start}
  .kv{display:grid;grid-template-columns:66px minmax(0,1fr);align-items:center;gap:8px;height:22px;
      font-size:11.5px;min-width:0}
  .kv .k{color:var(--text-muted);font-size:10.5px;line-height:1;white-space:nowrap}
  .kv .v{font-family:var(--mono);font-size:11.5px;line-height:1;white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis;min-width:0}
  .kv .v.plain{font-family:var(--font)}
  .kv .v.mute{color:var(--text-muted)}
  .dw-foot{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 14px 9px;color:var(--text-muted);
           font-size:10.5px;line-height:1}

  /* ---------- 右栏：规则链 ---------- */
  .insp{width:340px;flex:0 0 auto;background:var(--surface);border-left:1px solid var(--line);
        display:flex;flex-direction:column;overflow:hidden}
  .insp-head{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;
             border-bottom:1px solid var(--line)}
  .insp-head h2{margin:0;font-size:13px;font-weight:600;line-height:1}
  .badge{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);line-height:1}
  .ih-flex{flex:1}
  .insp-body{flex:1;min-height:0;overflow-y:auto;padding-bottom:10px}
  .insp-body::-webkit-scrollbar{width:10px}
  .insp-body::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;border:3px solid var(--surface)}
  .rc{margin:10px 12px 0;border:1px solid var(--line);border-radius:9px;background:var(--surface);
      padding:9px 11px 11px}
  .rc.off{opacity:.6}
  .rc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .rc-no{width:18px;height:18px;flex:0 0 auto;border-radius:50%;background:var(--accent-weak);
         color:var(--accent-text);font-family:var(--mono);font-size:10.5px;display:grid;place-items:center}
  .rc-title{font-size:12.5px;font-weight:600;line-height:1}
  .rc-flex{flex:1}
  .toggle{width:30px;height:17px;flex:0 0 auto;border-radius:99px;border:0;padding:0;background:var(--accent);
          position:relative;cursor:default;transition:background .14s}
  .toggle::after{content:"";position:absolute;right:2px;top:2px;width:13px;height:13px;border-radius:50%;
                 background:#fff;transition:transform .14s,left .14s,right .14s}
  .toggle.off{background:var(--line-2)}
  .toggle.off::after{right:15px;background:var(--surface)}
  .fld{margin-bottom:8px}
  .fld:last-child{margin-bottom:0}
  .lbl{display:block;color:var(--text-2);font-size:10.5px;line-height:1;margin-bottom:4px}
  .inp{height:26px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;
       padding:0 8px;background:var(--surface);transition:border-color .12s}
  .inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .inp input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:var(--mono);
             font-size:11.5px;color:var(--text);line-height:1}
  .row2{display:flex;gap:8px}
  .row2>.fld{flex:1;min-width:0}
  .swrow{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);line-height:1;
         margin-bottom:8px;cursor:default}
  .sw{width:26px;height:15px;flex:0 0 auto;border-radius:99px;border:0;padding:0;background:var(--line-2);
      position:relative;cursor:default;transition:background .14s}
  .sw.on{background:var(--accent)}
  .sw::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;
             background:var(--surface);transition:left .14s}
  .sw.on::after{left:13px}
  .scope{display:inline-flex;height:26px;padding:2px;gap:2px;border-radius:6px;border:1px solid var(--line)}
  .scope button{height:20px;padding:0 8px;border:0;border-radius:4px;background:transparent;
                font-size:11px;color:var(--text-2);line-height:1;cursor:default}
  .scope button.on{background:var(--accent-weak);color:var(--accent-text);font-weight:600}
  .chain{padding:10px 14px 0;margin-top:2px;border-top:1px solid var(--line);color:var(--text-muted);
         font-size:10.5px;line-height:1;display:flex;align-items:center;gap:6px}

  /* ---------- 行内确认条 ---------- */
  .confirm{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;
           background:color-mix(in srgb,var(--accent) 8%,var(--surface));
           border-top:1px solid color-mix(in srgb,var(--accent) 22%,var(--line))}
  .confirm .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}
  .confirm-text{font-size:11.5px;line-height:1;color:var(--text)}
  .confirm-text b{font-weight:600}
  .cf-flex{flex:1}

  /* ---------- 底栏 ---------- */
  .actionbar{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 16px;
             background:var(--surface);border-top:1px solid var(--line)}
  .ab-sel{display:inline-flex;align-items:center;gap:8px;color:var(--text-2);font-size:11.5px;line-height:1}
  .ab-sel b{color:var(--text);font-weight:600}
  .ab-sel .sep{width:1px;height:11px;background:var(--line-2)}
  .ab-sel .mono{font-family:var(--mono);font-size:11px}
  .ab-flex{flex:1}
  .btn.lg{height:32px;padding:0 13px;font-size:12.5px;border-radius:8px}

  /* ---------- 动态提示（延迟出现，替代按钮上的常驻快捷键） ---------- */
  .hint{position:absolute;z-index:40;display:none;max-width:280px;padding:4px 8px;border-radius:6px;
        background:color-mix(in srgb,var(--text) 92%,transparent);color:var(--surface);
        font-size:11px;line-height:1.45;white-space:nowrap;pointer-events:none;
        transform:translate(-50%,0);box-shadow:0 3px 10px rgba(0,0,0,.20)}
  .hint.on{display:block}
  .hint .k{opacity:.7;font-family:var(--mono);font-size:10.5px;margin-left:6px}

  /* ---------- 弹出菜单 ---------- */
  .menu{position:absolute;z-index:30;display:none;min-width:184px;padding:4px;border-radius:9px;
        background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-pop)}
  .menu.on{display:block;animation:pop .1s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .mi{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;border:0;border-radius:5px;
      background:transparent;font-size:12px;line-height:1;text-align:left;cursor:default;width:100%}
  .mi:hover{background:var(--accent);color:var(--on-accent)}
  .mi:hover .mik,.mi:hover .mchk{color:var(--on-accent)}

    let idx = 0;

    const r2 = state.rules.find(r=>r.id===2);
    return visible.map(it=>{
      let base = it.name;
      if (r1 && r1.on && r1.from){
        const flags = r1.caseSensitive?'g':'gi';
        base = base.replace(new RegExp(r1.from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),flags), r1.to||'');
      }
      if (r2 && r2.on){
        const num = String(parseInt(r2.start,10)+idx*parseInt(r2.step||'1',10)).padStart(3,'0');
        const ext = base.lastIndexOf('.')>0 ? base.slice(base.lastIndexOf('.')) : '';
        const stem = base.slice(0, base.length-ext.length).replace(/\d+$/,'').replace(/\s+$/,'');
        base = stem + num + ext;
      }
      idx++;
      const newName = base;
      return {item:it, newName, changed:newName!==it.name};
    });
  }

  let toastTimer=null;
  function toast(msg, undoable){
    const t=$('#toast');
    $('#toast-text').innerHTML = msg + (undoable? ' <button class="undo">撤销</button>' : '');
    t.classList.add('on');
    const u = $('.undo',t);
    if(u) u.onclick = ()=>{ doUndo(); t.classList.remove('on'); };
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove('on'), undoable?3600:2000);
  }
  function doUndo(){
    if(!state.history.length){ toast('没有可撤销的操作'); return; }
    state.future.push(snapshot());
    const s=state.history.pop(); state.items=s.items; state.rules=s.rules; state.activeId=s.activeId;
    renderAll(); toast('已撤销上一步');
  }
  function doRedo(){
    if(!state.future.length){ toast('没有可重做的操作'); return; }
    state.history.push(snapshot());
    const s=state.future.pop(); state.items=s.items; state.rules=s.rules; state.activeId=s.activeId;

  });
  $('#mi-keys').addEventListener('click',()=>{ closeAll(); openKeys(); });
  $('#mi-filter').addEventListener('click',()=>{ closeAll(); $('#q').focus(); toast('在搜索框中输入以筛选列表'); });
  $('#mi-settings').addEventListener('click',()=>{ closeAll(); toast('设置窗口（原型未展开）'); });

  // 快捷键清单（快捷键只在这里出现）
  function openKeys(){
    const card=$('.sheet-card');
    card.innerHTML =
      '<div class="sc-head"><h3>键盘快捷键</h3><span class="sc-flex"></span>'+
      '<button class="btn icon" id="keys-close"><svg class="ic" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>'+
      '<div class="sc-body" style="padding:8px 0">'+
      [['添加文件','Ctrl O'],['添加文件夹','Ctrl Shift O'],['应用更名','Ctrl Enter'],['预览差异','Ctrl P'],
       ['撤销','Ctrl Z'],['重做','Ctrl Shift Z'],['搜索','Ctrl F'],['切换检查器','Ctrl I'],
       ['收起右栏','Ctrl \\'],['全选','Ctrl A'],['清空列表','Ctrl Backspace']]
      .map(([k,v])=>'<div class="drow" style="grid-template-columns:1fr auto;font-family:var(--font)"><span class="d-old" style="color:var(--text)">'+k+'</span><span class="d-new" style="font-family:var(--mono);font-size:11px;color:var(--text-2)">'+v+'</span></div>').join('')+
      '</div>'+
      '<div class="sc-foot"><span class="sc-note">快捷键不出现在按钮上，悬停时才提示</span><span class="sc-flex2"></span>'+
      '<button class="btn sm" id="keys-cancel">关闭</button></div>';
    $('#sheet').classList.add('on');
    $('#keys-close').onclick=closeSheet; $('#keys-cancel').onclick=closeSheet;
  }
  function closeSheet(){ $('#sheet').classList.remove('on'); }

  document.addEventListener('click', e=>{
    if(!e.target.closest('.menu') && !e.target.closest('#more-btn') && !e.target.closest('#view-btn')) {
      $$('.menu.on').forEach(m=>m.classList.remove('on'));
    }
    if(!e.target.closest('#pop-clear') && !e.target.closest('#clear-list')) $('#pop-clear').classList.remove('on');
  });

  // 主题
  $('#theme-btn').addEventListener('click',()=>{
    const cur=document.documentElement.dataset.theme;
    const next=cur==='light'?'dark':'light';
    document.documentElement.dataset.theme=next;
    $('#theme-ic').innerHTML = next==='dark'?'<circle cx="8" cy="8" r="5"/><path d="M8 3v10" fill="currentColor" stroke="none" stroke-width="0"/>':'<circle cx="8" cy="8" r="5"/><path d="M8 3v10"/>';
    toast(next==='dark'?'已切换到深色外观':'已切换到浅色外观');
  });

  // 路径条 pills
  $('#scan-pill').addEventListener('click',()=>{
    const cur=$('#scan-label').textContent;
    const next = cur.indexOf('递归')===0 ? '仅当前层 · 含文件' : '递归 · 含文件夹';
    $('#scan-label').textContent=next; toast('扫描方式：'+next); renderAll();
  });
  $('#layout-pill').addEventListener('click',()=>{
    const cur=$('#layout-label').textContent;
    const next = cur.indexOf('并肩')===0 ? '上下 · 旧在上' : '并肩 · 文件在左';
    $('#layout-label').textContent=next; toast('显示方式：'+next);
  });

  // 新增规则
  $('#add-rule').addEventListener('click',()=>{
    pushHistory();
    const id=Math.max(0,...state.rules.map(r=>r.id))+1;
    state.rules.push({id,type:'replace',title:'替换 '+(state.rules.length+1),on:true,from:'IMG_',to:'相片',caseSensitive:false,scope:'all'});
    renderAll(); toast('已添加一条替换规则', true);
  });

  /* ---------- 动态提示 ---------- */
  let hintTimer=null, hintOwner=null;
  function showHint(target){
    const h=$('#hint');
    const label=target.getAttribute('data-hint');
    if(!label) return;
    const key=target.getAttribute('data-key');
    h.innerHTML = label + (key? ' <span class="k">'+key+'</span>' : '');
    h.classList.add('on');
    const r=target.getBoundingClientRect();
    const wr=$('#win').getBoundingClientRect();
    const hh=h.offsetHeight||22, hw=h.offsetWidth||120;
    const top = (r.bottom + 6 + hh > wr.bottom - 6) ? (r.top - hh - 6) : (r.bottom + 6);
    h.style.left = (Math.min(Math.max(r.left+r.width/2, hw/2+8), wr.right-hw/2-8) - wr.left)+'px';
    h.style.top = (Math.max(top, wr.top+6) - wr.top)+'px';
  }
  document.addEventListener('mouseover', e=>{
    const t=e.target.closest('[data-hint]');
    if(!t || t===hintOwner) return;
    hintOwner=t;
    clearTimeout(hintTimer);
    $('#hint').classList.remove('on');
    if(t.getBoundingClientRect().width===0) return;
    hintTimer=setTimeout(()=>showHint(t), 520);
  });
  document.addEventListener('mouseout', e=>{
    const from=e.target.closest('[data-hint]');
    if(!from) return;
    const to=(e.relatedTarget && e.relatedTarget.closest) ? e.relatedTarget.closest('[data-hint]') : null;
    if(from===to) return;
    hintOwner=null; clearTimeout(hintTimer); $('#hint').classList.remove('on');
  });
  document.addEventListener('mousedown',()=>{ hintOwner=null; clearTimeout(hintTimer); $('#hint').classList.remove('on'); });

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', e=>{
    const meta = e.ctrlKey || e.metaKey;
    if(e.key==='Escape'){
      closeAll(); closeSheet(); $('#hint').classList.remove('on');
      if(!!state.query){ $('#q-clear').click(); }
      return;
    }
    if(meta && e.key.toLowerCase()==='f'){ e.preventDefault(); $('#q').focus(); return; }
    if(meta && e.key.toLowerCase()==='i'){ e.preventDefault(); state.drawerOpen=!state.drawerOpen; renderDrawer(); return; }
    if(meta && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); doUndo(); return; }
    if(meta && e.key.toLowerCase()==='z' && e.shiftKey){ e.preventDefault(); doRedo(); return; }
    if(meta && e.key==='Enter'){ e.preventDefault(); apply(); return; }
    if(meta && e.key.toLowerCase()==='p'){ e.preventDefault(); renderDiff(); $('#sheet').classList.add('on'); return; }
    if(meta && e.key.toLowerCase()==='a'){
      const tag=(document.activeElement||{}).tagName;
      if(tag==='INPUT') return;
      e.preventDefault(); state.items.forEach(i=>i.sel=true); renderRows(); renderConfirm(); return;
    }
    if(meta && e.key==='Backspace'){ e.preventDefault(); $('#clear-list').click(); return; }
  });

  renderAll();
  // 出对照图用：?collapsed
  if(location.search.indexOf('collapsed')>=0){ state.drawerOpen=false; state.items.forEach(i=>i.sel=true); renderDrawer(); renderConfirm(); }
  // 出对照图用：?hint=<选择器> 固定展示某条动态提示
  const hp=new URLSearchParams(location.search).get('hint');
  if(hp){ const el=document.querySelector(hp); if(el){ showHint(el); } }
})();
</script>
</body>
</html>
